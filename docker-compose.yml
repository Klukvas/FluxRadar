name: fluxradar

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - fluxradar_postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluxradar -d fluxradar']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${FLUXRADAR_API_IMAGE:-fluxradar-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${FLUXRADAR_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PORT: 3310
      FRONTEND_ORIGIN: https://fluxradar.net
    command:
      - sh
      - -c
      - >-
        apps/api/node_modules/.bin/prisma migrate deploy
        --schema apps/api/prisma/schema.prisma && exec node apps/api/dist/index.js
    ports:
      - '127.0.0.1:${FLUXRADAR_API_PORT:-3310}:3310'
    expose:
      - '3310'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3310/health').then((r) => {
          if (!r.ok) process.exit(1); }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${FLUXRADAR_WEB_IMAGE:-fluxradar-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    ports:
      - '127.0.0.1:${FLUXRADAR_WEB_PORT:-8080}:80'
    restart: unless-stopped
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      FLUXRADAR_API_UPSTREAM: ${FLUXRADAR_API_UPSTREAM:-api:3310}
      FLUXRADAR_WEB_UPSTREAM: ${FLUXRADAR_WEB_UPSTREAM:-web:80}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${FLUXRADAR_CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  fluxradar_postgres:
  caddy_data:
  caddy_config:
