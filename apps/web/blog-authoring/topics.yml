# Blog topic queue for the scheduled blog agent. The playbook is apps/web/blog-authoring/README.md.
#
# The agent writes the first two `todo` topics on each run, in Ukrainian and English.
# Status values:
#   todo      ready to write, in queue order
#   done      written; published, uk_slug and en_slug are filled in
#   proposed  suggested by the agent; the owner changes it to `todo` to approve it
#
# Reorder, edit or delete `todo` topics freely. The agent reads the file fresh
# on every run.

topics:
