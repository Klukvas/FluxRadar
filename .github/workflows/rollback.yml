name: Roll back production

# The rollback an operator asks for, rather than one a failure triggers.
#
# The deploy already rolls itself back from the two places that can tell whether
# traffic was switched: the release script's exit handler, and the public smoke
# test after that script has exited. Neither covers the case this workflow is
# for — the release passed every check, went live, and turned out to be wrong
# ten minutes or a day later. Until now that meant SSH-ing to the server and
# copying a command out of docs/DEPLOYMENT.md while the site was broken.
#
# It runs exactly the script the deploy runs, against the target the deploy
# recorded in runtime/rollback.env before it switched traffic, and then asks the
# same public question the deploy's last stage asks. It never invents a target of
# its own: if rollback.env names none, the script changes nothing and says so.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "roll back production" to confirm. Anything else stops here.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # The same group the deploy uses, and deliberately so: a rollback must never
  # run while a release is switching traffic underneath it.
  group: production-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore the previous release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "roll back production" ]; then
            echo 'ERROR: this workflow changes what production serves and was not confirmed.' >&2
            echo 'Re-run it and type: roll back production' >&2
            exit 1
          fi

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

      - name: Roll back
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
        run: |
          set -uo pipefail
          # The script ships with the release, so the version that runs is the
          # one the live release carries — the same code path the deploy uses.
          # Its exit code is the whole verdict and none of the three outcomes is
          # allowed to pass quietly: 0 restored, 3 there was no target so NOTHING
          # was touched, anything else attempted and failed.
          rollback_status=0
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" <<'REMOTE' || rollback_status=$?
          set -eu
          APP_DIR="$1"
          CURRENT="$(readlink -f "$APP_DIR/current" 2>/dev/null || true)"
          if [ -z "$CURRENT" ] || [ ! -d "$CURRENT" ]; then
            echo "ERROR: $APP_DIR/current does not resolve to a release directory; there is nothing to roll back from." >&2
            exit 1
          fi
          bash "$CURRENT/deploy/rollback-release.sh" "$APP_DIR" "$CURRENT"
          REMOTE

          if [ "$rollback_status" -eq 3 ]; then
            echo 'CRITICAL: runtime/rollback.env names no earlier release, so NOTHING was changed and the release you wanted to undo is still live. Deploy a known-good commit instead (docs/DEPLOYMENT.md, "Release rollback").' >&2
            exit 1
          fi
          if [ "$rollback_status" -ne 0 ]; then
            echo 'CRITICAL: the rollback failed; production may still be serving the release you wanted to undo. Recover by hand (docs/DEPLOYMENT.md, "Release rollback").' >&2
            exit 1
          fi

          # Restored is a claim, not a fact, until the site answers from outside.
          if ! bash deploy/public-smoke.sh --host fluxradar.net; then
            echo 'CRITICAL: the rollback ran but fluxradar.net still fails the public smoke test. Production needs manual recovery (docs/DEPLOYMENT.md, "Release rollback").' >&2
            exit 1
          fi
          echo 'Rolled back: the previous release is serving fluxradar.net again.'
