name: CI

# The merge gate. Every quality job lives in the reusable `quality.yml`, which
# `deploy.yml` runs again on main before it touches the server — one definition,
# two callers, so the two can no longer drift the way the copied jobs had.
#
# Deliberately NOT triggered by a push to main. The same gates run inside the
# deploy for that commit, and running both meant every merge paid for two full
# test suites to learn the same thing twice.

on:
  pull_request:
  schedule:
    # Mondays, 05:40 UTC. Only the advisory job needs this: an advisory is
    # published against code that has not changed, so a check that runs only on
    # a diff would never see it on a quiet week.
    - cron: '40 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    # On a pull request the images are built too: a broken Dockerfile is
    # otherwise found by the deploy, after the merge.
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/quality.yml
    with:
      build-images: true

  e2e:
    name: End-to-end (Playwright)
    # Pull requests only, like the rest of this file: the suite drives the web
    # app against a stubbed API, so it proves the screens still match the specs
    # and needs no secret, database or deployed service. It stays out of the
    # reusable quality gates so the deploy does not pay for it a second time.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/node-workspace

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/**" build

      # The browser version follows the @playwright/test version in the lockfile.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # CI=true gives the config's 2 retries, so a one-off timing miss on a
      # shared runner is retried instead of failing the merge gate.
      - name: Run the Playwright suite
        run: pnpm exec playwright test

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Deliberately its own job, and deliberately NOT part of the production
    # deploy. An advisory is published against code that is already merged and
    # already running, so gating the deploy on it would block the hotfix that
    # fixes it. It gates the merge instead: this workflow runs on every pull
    # request and weekly on the default branch, and a failure here is a
    # dependency to upgrade, not a release to hold.
    #
    # This checks the public advisory database over the network. It needs no
    # secret and no production credential, and it proves nothing about a
    # vulnerability nobody has reported yet.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/node-workspace

      # Blocking: these are the packages that end up inside the deployed images.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high

      # Advisory: a build-time package cannot be reached by a request to the
      # deployed service, but it does run on this runner and on developer
      # machines. Reported, not enforced, so a vitest advisory cannot stop a fix
      # from being merged.
      - name: Audit build and test dependencies
        continue-on-error: true
        run: pnpm audit --audit-level high
