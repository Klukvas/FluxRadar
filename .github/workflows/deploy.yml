name: Deploy production

# The production rollout, as stages rather than as one long job.
#
# It used to be two jobs: the quality gates, and a single "Deploy to Hetzner"
# that built both images, uploaded them, ran the release script and checked the
# result. One job meant one verdict — a red run said "the deploy failed" and
# nothing more — and the two image builds that dominate its wall clock ran one
# after the other for no reason.
#
# The stages below are the phases the deploy already had, made visible and, where
# they are independent, made concurrent:
#
#   quality    the gates, from the same definition the merge gate uses
#   preflight  reclaim this workflow's own stale staging dirs on the server
#   image-api  ┐ built, saved and shipped in parallel. None of them touches
#   image-web  │ anything that serves traffic, so any of them failing stops the
#   package    ┘ deploy with the previous release still live and untouched.
#   backup     a snapshot BEFORE a migration that cannot be undone
#   release    migrate, prove a rollback is possible, start, switch traffic
#   verify     look at the site from outside, and roll back if it is broken
#
# WHY THERE IS NO "roll back on failure" JOB, because that is the obvious
# refactor here and it is wrong: a rollback is only correct once traffic has been
# switched. The release script knows the moment that happened and its exit
# handler acts on it; a job-level `if: failure()` does not, and after a failure
# that never reached production it would restore the PREVIOUS deploy's rollback
# target over a release that is serving perfectly well. Rollback stays with the
# two callers that can tell the difference — the release script's exit handler
# and the public smoke test — plus `rollback.yml`, where an operator decides.
#
# The workflow is still serialized by its concurrency group, so stages of two
# releases can never interleave.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    # The same jobs the merge gate runs, from one definition rather than a copy
    # that drifts. The images are not built here: this workflow builds them for
    # real two stages down, and building them twice proves nothing new.
    uses: ./.github/workflows/quality.yml
    with:
      build-images: false

  preflight:
    name: Preflight the server
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

      - name: Reclaim stale staging directories
        # Runs before anything is uploaded, and reclaims ONLY this workflow's own
        # per-release staging directories under APP_DIR/incoming. It never
        # touches releases, current, runtime, Docker data/volumes, or PostgreSQL.
        #
        # The free-space gate that used to live here has moved to the upload
        # itself: three stages now upload in parallel and each one knows the size
        # of its own artifact, which is a more precise question than this stage
        # could ask before any of them had been built.
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
        run: |
          set -euo pipefail
          # Only remove staging dirs this workflow itself creates, and only if
          # they are older than a threshold safely larger than a single deploy.
          # Deploys are serialized by the "production-deploy" concurrency group,
          # so a 60-minute floor cannot race an in-flight upload from another run.
          stale_minutes=60

          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$stale_minutes" "$APP_DIR" <<'REMOTE'
          set -eu
          STALE_MINUTES="$1"
          APP_DIR="$2"
          INCOMING_DIR="$APP_DIR/incoming"

          echo "----- remote disk usage: APP_DIR filesystem (before cleanup) -----"
          # df prints the mount point (e.g. /) in its last column, not the path we
          # pass, so the APP_DIR value is not written to the log here.
          df -P -h "$APP_DIR" || true

          # Ensure the staging parent exists (owner-only) so the cleanup below is
          # stable even on a fresh host. Creating it changes nothing about
          # releases, current, runtime, Docker data, or PostgreSQL.
          install -m 700 -d "$INCOMING_DIR"

          echo "----- reclaiming stale FluxRadar staging dirs under incoming/ -----"
          # Safety scope, enforced by the predicates below:
          #   -mindepth/-maxdepth 1 : only immediate children of incoming/; never
          #                           recurses into them or above incoming/.
          #   -type d               : only directories (per-release staging); never
          #                           files, symlinks, sockets, or Docker volumes.
          #   name is strict hex     : the name must look like a git commit id
          #                           (7-64 lowercase hex chars); anything else is
          #                           skipped, so a stray file/dir is never removed.
          #   -mmin +N               : only entries older than the stale threshold.
          # APP_DIR/releases, current, runtime, Docker data (/var/lib/docker), and
          # PostgreSQL's volume all live OUTSIDE incoming/, so none can be selected.
          find "$INCOMING_DIR" -mindepth 1 -maxdepth 1 -type d -mmin "+${STALE_MINUTES}" -printf '%f\n' \
            | while IFS= read -r name; do
                case "$name" in
                  ''|*[!0-9a-f]*) continue ;;
                esac
                len=${#name}
                if [ "$len" -lt 7 ] || [ "$len" -gt 64 ]; then
                  continue
                fi
                target="$INCOMING_DIR/$name"
                case "$target" in
                  "$INCOMING_DIR"/*) ;;
                  *) continue ;;
                esac
                echo "removing stale staging dir incoming/$name"
                rm -rf -- "$target"
              done

          echo "----- remote disk usage: APP_DIR filesystem (after cleanup) -----"
          df -P -h "$APP_DIR" || true
          REMOTE

  image-api:
    name: Build and ship the API image
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

      - name: Build the API image
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --file Dockerfile.api --tag "fluxradar-api:$RELEASE_ID" .
          docker save --output "$RUNNER_TEMP/fluxradar-api.tar" "fluxradar-api:$RELEASE_ID"

      # Straight from this runner to the server. The obvious alternative — a
      # GitHub artifact handed to a later job — is not available here: the API
      # image carries the whole workspace and its node_modules, which is larger
      # than this repository's entire artifact allowance. A registry would fix
      # that properly; see docs/DEPLOYMENT.md, "What is not automated".
      - name: Ship the API image
        uses: ./.github/actions/remote-upload
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          user: ${{ secrets.PRODUCTION_SSH_USER }}
          app-dir: ${{ secrets.PRODUCTION_APP_DIR }}
          release-id: ${{ github.sha }}
          stage: api-image
          files: ${{ runner.temp }}/fluxradar-api.tar
          install: |
            docker load --input "$STAGE_DIR/fluxradar-api.tar"
            # Loading a tar that does not carry the expected tag is silent, and
            # the release script would then fail much later with "image not
            # found". Ask now, while this stage still owns the failure.
            docker image inspect "fluxradar-api:$RELEASE_ID" >/dev/null

  image-web:
    name: Build and ship the web image
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

      - name: Build the web image
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --file Dockerfile.web --build-arg VITE_API_URL=/api --tag "fluxradar-web:$RELEASE_ID" .
          docker save --output "$RUNNER_TEMP/fluxradar-web.tar" "fluxradar-web:$RELEASE_ID"

      # Straight from this runner to the server. The obvious alternative — a
      # GitHub artifact handed to a later job — is not available here: the API
      # image carries the whole workspace and its node_modules, which is larger
      # than this repository's entire artifact allowance. A registry would fix
      # that properly; see docs/DEPLOYMENT.md, "What is not automated".
      - name: Ship the web image
        uses: ./.github/actions/remote-upload
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          user: ${{ secrets.PRODUCTION_SSH_USER }}
          app-dir: ${{ secrets.PRODUCTION_APP_DIR }}
          release-id: ${{ github.sha }}
          stage: web-image
          files: ${{ runner.temp }}/fluxradar-web.tar
          install: |
            docker load --input "$STAGE_DIR/fluxradar-web.tar"
            # Loading a tar that does not carry the expected tag is silent, and
            # the release script would then fail much later with "image not
            # found". Ask now, while this stage still owns the failure.
            docker image inspect "fluxradar-web:$RELEASE_ID" >/dev/null

  package:
    name: Package and ship the release
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

      - name: Create release archive
        env:
          # Precedence, and there is only one rule: PRODUCTION_ENV_FILE is the
          # authoritative base and every other value here is an OPTIONAL
          # override that applies only when it is non-empty. The workflow never
          # pins a value of its own — a hardcoded ANTHROPIC_MODEL used to
          # silently outrank the base file and contradict docs/DEPLOYMENT.md.
          # A base file left on a retired model is caught by the API at startup
          # instead (integrations/anthropic-config.ts), by name.
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          INTERNAL_FREE_EMAILS: ${{ vars.FLUXRADAR_INTERNAL_FREE_EMAILS }}
          # The origins this deployment may re-check for free. A public https
          # origin is not a credential — it is printed on the site it names — so
          # it is a production environment VARIABLE, not a secret, and it can be
          # corrected without rewriting the base env file nobody can read back.
          # Empty keeps whatever PRODUCTION_ENV_FILE defines, like every other
          # override here, and with neither present every account keeps its one
          # free check (billing/free-check-allowlist.ts fails closed).
          PRODUCTION_FREE_CHECK_ALLOWED_ORIGINS: ${{ vars.PRODUCTION_FREE_CHECK_ALLOWED_ORIGINS }}
          PRODUCTION_INTEGRATION_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_INTEGRATION_ENCRYPTION_KEY }}
          PRODUCTION_BING_OAUTH_CLIENT_ID: ${{ secrets.PRODUCTION_BING_OAUTH_CLIENT_ID }}
          PRODUCTION_BING_OAUTH_CLIENT_SECRET: ${{ secrets.PRODUCTION_BING_OAUTH_CLIENT_SECRET }}
          PRODUCTION_BING_OAUTH_REDIRECT_URI: ${{ secrets.PRODUCTION_BING_OAUTH_REDIRECT_URI }}
          PRODUCTION_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_CLIENT_ID }}
          PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET }}
          PRODUCTION_GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_REDIRECT_URI }}
          PRODUCTION_ANTHROPIC_API_KEY: ${{ secrets.PRODUCTION_ANTHROPIC_API_KEY }}
          # A model identifier is not a secret, so it is a production
          # environment VARIABLE. Leave it unset to keep whatever
          # PRODUCTION_ENV_FILE defines (or the API default).
          PRODUCTION_ANTHROPIC_MODEL: ${{ vars.PRODUCTION_ANTHROPIC_MODEL }}
          PRODUCTION_PAGESPEED_API_KEY: ${{ secrets.PRODUCTION_PAGESPEED_API_KEY }}
          PRODUCTION_CRUX_API_KEY: ${{ secrets.PRODUCTION_CRUX_API_KEY }}
          # The network the crawl leaves from. Sites that block this server's
          # hosting network answer 403 to every request, which a report can only
          # describe as a site with no robots.txt that never returns 200 — so the
          # crawl goes out through a proxy those sites accept. Empty keeps what
          # PRODUCTION_ENV_FILE defines; with neither present the crawl is
          # direct, as before. It carries the proxy password, so it is a secret,
          # and a value that is present but unreadable fails the boot by name
          # (integrations/crawl-egress-config.ts) instead of quietly crawling
          # from the blocked network again.
          PRODUCTION_CRAWL_EGRESS_PROXY_URL: ${{ secrets.PRODUCTION_CRAWL_EGRESS_PROXY_URL }}
          # Transactional email (Resend). Overridable as a PAIR, and that is the
          # whole point: the key and the sender are useless apart. Setting one
          # without the other is the state this codebase refuses to let happen
          # quietly — registration succeeds, the browser is told a verification
          # email is on its way, and nothing arrives — so the API reports it as
          # `invalid` at boot, by name (email/resend-config.ts).
          #
          # Both are secrets. The key obviously; the sender so the deploy log
          # never prints a mailbox address for a crawler to find.
          #
          # Empty means "keep what PRODUCTION_ENV_FILE defines", like every other
          # override here. The address must be on a domain VERIFIED in Resend,
          # which nothing in this repository can check: an unverified sender is
          # an HTTP error on the first send, reported to the user as an
          # emailVerification status of "provider-error" (docs/DEPLOYMENT.md).
          PRODUCTION_RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
          PRODUCTION_RESEND_FROM_EMAIL: ${{ secrets.PRODUCTION_RESEND_FROM_EMAIL }}
          PRODUCTION_HETZNER_S3_ACCESS_KEY: ${{ secrets.PRODUCTION_HETZNER_S3_ACCESS_KEY }}
          PRODUCTION_HETZNER_S3_SECRET_KEY: ${{ secrets.PRODUCTION_HETZNER_S3_SECRET_KEY }}
          PRODUCTION_HETZNER_S3_ENDPOINT: ${{ secrets.PRODUCTION_HETZNER_S3_ENDPOINT }}
          PRODUCTION_HETZNER_S3_REGION: ${{ secrets.PRODUCTION_HETZNER_S3_REGION }}
          PRODUCTION_HETZNER_S3_BUCKET: ${{ secrets.PRODUCTION_HETZNER_S3_BUCKET }}
          # Database backups (deploy/backup). The encryption key is the one thing
          # that stands between an S3 credential leak and every customer record,
          # so it is a secret and it is NOT the object-storage key: rotating one
          # must not force the other. The retention knobs are not secrets — they
          # describe a policy — so they are production environment VARIABLES.
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
          PRODUCTION_BACKUP_PREFIX: ${{ vars.PRODUCTION_BACKUP_PREFIX }}
          PRODUCTION_BACKUP_RETENTION_DAYS: ${{ vars.PRODUCTION_BACKUP_RETENTION_DAYS }}
          PRODUCTION_BACKUP_MIN_KEEP: ${{ vars.PRODUCTION_BACKUP_MIN_KEEP }}
          PRODUCTION_BACKUP_MAX_DELETE: ${{ vars.PRODUCTION_BACKUP_MAX_DELETE }}
          PRODUCTION_BACKUP_STALE_HOURS: ${{ vars.PRODUCTION_BACKUP_STALE_HOURS }}
          PRODUCTION_BACKUP_MAX_AGE_HOURS: ${{ vars.PRODUCTION_BACKUP_MAX_AGE_HOURS }}
          # FastSpring paid checkout. Only the three credentials are secrets; the
          # rest describe which store, checkout and products this deployment
          # sells, so they are production environment VARIABLES and are visible
          # in the FastSpring app to anyone who can open it. FASTSPRING_MODE
          # decides whether real cards are charged, and readFastSpringConfig
          # refuses "live" until FASTSPRING_STORE_VERIFIED says an operator
          # checked the store (docs/FASTSPRING.md section 4).
          #
          # The set is all-or-nothing: a half-configured provider is reported as
          # "misconfigured" and sells nothing. deploy-003 asserts every name
          # readFastSpringConfig requires is wired here.
          PRODUCTION_FASTSPRING_API_USERNAME: ${{ secrets.PRODUCTION_FASTSPRING_API_USERNAME }}
          PRODUCTION_FASTSPRING_API_PASSWORD: ${{ secrets.PRODUCTION_FASTSPRING_API_PASSWORD }}
          PRODUCTION_FASTSPRING_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_FASTSPRING_WEBHOOK_SECRET }}
          PRODUCTION_FASTSPRING_MODE: ${{ vars.PRODUCTION_FASTSPRING_MODE }}
          PRODUCTION_FASTSPRING_SESSION_API: ${{ vars.PRODUCTION_FASTSPRING_SESSION_API }}
          PRODUCTION_FASTSPRING_CHECKOUT_PATH: ${{ vars.PRODUCTION_FASTSPRING_CHECKOUT_PATH }}
          PRODUCTION_FASTSPRING_POPUP_STOREFRONT: ${{ vars.PRODUCTION_FASTSPRING_POPUP_STOREFRONT }}
          PRODUCTION_FASTSPRING_STOREFRONT_URL: ${{ vars.PRODUCTION_FASTSPRING_STOREFRONT_URL }}
          PRODUCTION_FASTSPRING_PRODUCT_PATH_BASIC: ${{ vars.PRODUCTION_FASTSPRING_PRODUCT_PATH_BASIC }}
          PRODUCTION_FASTSPRING_PRODUCT_PATH_COMPLETE: ${{ vars.PRODUCTION_FASTSPRING_PRODUCT_PATH_COMPLETE }}
          PRODUCTION_FASTSPRING_CURRENCY_POLICY: ${{ vars.PRODUCTION_FASTSPRING_CURRENCY_POLICY }}
          PRODUCTION_FASTSPRING_STORE_VERIFIED: ${{ vars.PRODUCTION_FASTSPRING_STORE_VERIFIED }}
          PRODUCTION_FASTSPRING_SESSION_EXPIRATION_DAYS: ${{ vars.PRODUCTION_FASTSPRING_SESSION_EXPIRATION_DAYS }}
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='client_secret_*.json' \
            -czf "$RUNNER_TEMP/release.tar.gz" .
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$RUNNER_TEMP/production.env"

          # Upserts KEY=<value> into the release env file, but only when the
          # optional source secret is non-empty. The value is read from the named
          # environment variable and written with printf %s, so it never appears
          # in the workflow log or process arguments and is copied verbatim (no
          # awk/gsub escaping surprises). An unset or empty secret is skipped so a
          # blank optional value can never override what PRODUCTION_ENV_FILE
          # already defines.
          upsert_env() {
            key="$1"
            source_var="$2"
            value="$(printenv "$source_var" || true)"
            if [ -z "$value" ]; then
              return 0
            fi
            grep -v "^${key}=" "$RUNNER_TEMP/production.env" \
              > "$RUNNER_TEMP/production.env.tmp" || true
            mv "$RUNNER_TEMP/production.env.tmp" "$RUNNER_TEMP/production.env"
            printf '%s=%s\n' "$key" "$value" >> "$RUNNER_TEMP/production.env"
          }

          upsert_env FLUXRADAR_INTERNAL_FREE_EMAILS INTERNAL_FREE_EMAILS
          upsert_env FLUXRADAR_FREE_CHECK_ALLOWED_ORIGINS PRODUCTION_FREE_CHECK_ALLOWED_ORIGINS
          upsert_env INTEGRATION_ENCRYPTION_KEY PRODUCTION_INTEGRATION_ENCRYPTION_KEY
          upsert_env BING_OAUTH_CLIENT_ID PRODUCTION_BING_OAUTH_CLIENT_ID
          upsert_env BING_OAUTH_CLIENT_SECRET PRODUCTION_BING_OAUTH_CLIENT_SECRET
          upsert_env BING_OAUTH_REDIRECT_URI PRODUCTION_BING_OAUTH_REDIRECT_URI
          upsert_env GOOGLE_OAUTH_CLIENT_ID PRODUCTION_GOOGLE_OAUTH_CLIENT_ID
          upsert_env GOOGLE_OAUTH_CLIENT_SECRET PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET
          upsert_env GOOGLE_OAUTH_REDIRECT_URI PRODUCTION_GOOGLE_OAUTH_REDIRECT_URI
          upsert_env ANTHROPIC_API_KEY PRODUCTION_ANTHROPIC_API_KEY
          upsert_env ANTHROPIC_MODEL PRODUCTION_ANTHROPIC_MODEL
          upsert_env PAGESPEED_API_KEY PRODUCTION_PAGESPEED_API_KEY
          upsert_env CRUX_API_KEY PRODUCTION_CRUX_API_KEY
          upsert_env CRAWL_EGRESS_PROXY_URL PRODUCTION_CRAWL_EGRESS_PROXY_URL
          upsert_env RESEND_API_KEY PRODUCTION_RESEND_API_KEY
          upsert_env RESEND_FROM_EMAIL PRODUCTION_RESEND_FROM_EMAIL
          upsert_env HETZNER_S3_ACCESS_KEY PRODUCTION_HETZNER_S3_ACCESS_KEY
          upsert_env HETZNER_S3_SECRET_KEY PRODUCTION_HETZNER_S3_SECRET_KEY
          upsert_env HETZNER_S3_ENDPOINT PRODUCTION_HETZNER_S3_ENDPOINT
          upsert_env HETZNER_S3_REGION PRODUCTION_HETZNER_S3_REGION
          upsert_env HETZNER_S3_BUCKET PRODUCTION_HETZNER_S3_BUCKET
          upsert_env FLUXRADAR_BACKUP_ENCRYPTION_KEY PRODUCTION_BACKUP_ENCRYPTION_KEY
          upsert_env FLUXRADAR_BACKUP_PREFIX PRODUCTION_BACKUP_PREFIX
          upsert_env FLUXRADAR_BACKUP_RETENTION_DAYS PRODUCTION_BACKUP_RETENTION_DAYS
          upsert_env FLUXRADAR_BACKUP_MIN_KEEP PRODUCTION_BACKUP_MIN_KEEP
          upsert_env FLUXRADAR_BACKUP_MAX_DELETE PRODUCTION_BACKUP_MAX_DELETE
          upsert_env FLUXRADAR_BACKUP_STALE_HOURS PRODUCTION_BACKUP_STALE_HOURS
          upsert_env FLUXRADAR_BACKUP_MAX_AGE_HOURS PRODUCTION_BACKUP_MAX_AGE_HOURS
          upsert_env FASTSPRING_API_USERNAME PRODUCTION_FASTSPRING_API_USERNAME
          upsert_env FASTSPRING_API_PASSWORD PRODUCTION_FASTSPRING_API_PASSWORD
          upsert_env FASTSPRING_WEBHOOK_SECRET PRODUCTION_FASTSPRING_WEBHOOK_SECRET
          upsert_env FASTSPRING_MODE PRODUCTION_FASTSPRING_MODE
          upsert_env FASTSPRING_SESSION_API PRODUCTION_FASTSPRING_SESSION_API
          upsert_env FASTSPRING_CHECKOUT_PATH PRODUCTION_FASTSPRING_CHECKOUT_PATH
          upsert_env FASTSPRING_POPUP_STOREFRONT PRODUCTION_FASTSPRING_POPUP_STOREFRONT
          upsert_env FASTSPRING_STOREFRONT_URL PRODUCTION_FASTSPRING_STOREFRONT_URL
          upsert_env FASTSPRING_PRODUCT_PATH_BASIC PRODUCTION_FASTSPRING_PRODUCT_PATH_BASIC
          upsert_env FASTSPRING_PRODUCT_PATH_COMPLETE PRODUCTION_FASTSPRING_PRODUCT_PATH_COMPLETE
          upsert_env FASTSPRING_CURRENCY_POLICY PRODUCTION_FASTSPRING_CURRENCY_POLICY
          upsert_env FASTSPRING_STORE_VERIFIED PRODUCTION_FASTSPRING_STORE_VERIFIED
          upsert_env FASTSPRING_SESSION_EXPIRATION_DAYS PRODUCTION_FASTSPRING_SESSION_EXPIRATION_DAYS

          # Both env-file parsers used by this deploy must read the same values:
          # compose starts PostgreSQL and Caddy, `docker run` starts the API and
          # web containers, and they disagree about quotes, "$", inline comments
          # and trailing spaces. The normalizer rewrites the file into the one
          # form both read identically, cross-checks DATABASE_URL against
          # POSTGRES_*, and fails the deploy on anything it cannot express in
          # both. It prints variable NAMES and problems only, never a value.
          node deploy/normalize-env-file.cjs "$RUNNER_TEMP/production.env"

      - name: Upload the release
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Staged under a dedicated, per-release directory on the ROOT
          # filesystem (APP_DIR/incoming/<commit>/release) rather than the tiny
          # /tmp tmpfs. The commit-named parent is shared with the two image
          # stages running beside this one; the "release" leaf is this stage's
          # alone, so cleaning up after a failure here cannot disturb them.
          STAGE_DIR="$APP_DIR/incoming/$RELEASE_ID/release"

          # Measure the exact bytes about to be uploaded so the remote free-space
          # gate is precise rather than an arbitrary constant. `du -ck` reports
          # block usage, which rounds up and is therefore conservative.
          required_kb="$(du -ck \
            "$RUNNER_TEMP/release.tar.gz" \
            "$RUNNER_TEMP/production.env" \
            | tail -n 1 | cut -f1)"
          case "$required_kb" in
            ''|*[!0-9]*)
              echo "ERROR: could not determine the local upload size (got '$required_kb')" >&2
              exit 1
              ;;
          esac
          # The archive is extracted on the server, which transiently roughly
          # doubles its footprint. Reserve headroom equal to the artifact,
          # floored at 512 MiB, to cover that copy plus slack.
          margin_kb="$required_kb"
          floor_kb=524288
          if [ "$margin_kb" -lt "$floor_kb" ]; then margin_kb="$floor_kb"; fi
          need_kb=$(( required_kb + margin_kb ))

          # On ANY failure below, remove ONLY this stage's staging dir to reclaim
          # space, then re-raise the original error. This never touches releases,
          # current, runtime, Docker data/volumes, or PostgreSQL, and it preserves
          # the failing exit status so the real error is not masked.
          cleanup_stage() {
            # shellcheck disable=SC2029
            ssh "$SSH_USER@$SSH_HOST" "rm -rf -- '$STAGE_DIR'" || true
          }
          trap 'rc=$?; cleanup_stage; exit "$rc"' ERR

          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$need_kb" "$APP_DIR" "$RELEASE_ID" <<'REMOTE'
          set -eu
          NEED_KB="$1"
          APP_DIR="$2"
          RELEASE_ID="$3"
          install -m 700 -d "$APP_DIR/incoming" "$APP_DIR/incoming/$RELEASE_ID" \
            "$APP_DIR/incoming/$RELEASE_ID/release"
          avail_kb="$(df -P -k "$APP_DIR" | awk 'NR==2 {print $4}')"
          case "$avail_kb" in
            ''|*[!0-9]*)
              echo "ERROR: could not determine free space on the APP_DIR filesystem (got '$avail_kb')" >&2
              exit 1
              ;;
          esac
          if [ "$avail_kb" -lt "$NEED_KB" ]; then
            echo "ERROR: insufficient free space on the APP_DIR filesystem: ${avail_kb} KiB free but ${NEED_KB} KiB required for this release." >&2
            echo "Refusing to upload. No releases, current symlink, runtime, Docker data/volumes, or PostgreSQL were touched; inspect the APP_DIR filesystem." >&2
            exit 1
          fi
          echo "OK: APP_DIR filesystem has ${avail_kb} KiB free (need ${NEED_KB} KiB); proceeding to upload."
          REMOTE

          scp "$RUNNER_TEMP/release.tar.gz" "$SSH_USER@$SSH_HOST:$STAGE_DIR/release.tar.gz"
          scp "$RUNNER_TEMP/production.env" "$SSH_USER@$SSH_HOST:$STAGE_DIR/production.env"

          # Extract and install strictly from the staging dir, then remove ONLY
          # that exact staging dir on success. If this fails partway, the ERR trap
          # above cleans it; the (inactive) new release dir is left for the
          # retention sweep and no active release or volume is deleted.
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$RELEASE_ID" <<'REMOTE'
          set -eu
          APP_DIR="$1"
          RELEASE_ID="$2"
          STAGE_DIR="$APP_DIR/incoming/$RELEASE_ID/release"
          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$STAGE_DIR/release.tar.gz" -C "$RELEASE_DIR"
          install -m 600 "$STAGE_DIR/production.env" "$RELEASE_DIR/.env.production"
          # Success: remove ONLY this stage's staging dir to reclaim space.
          rm -rf -- "$STAGE_DIR"
          REMOTE

          trap - ERR

  backup:
    name: Snapshot the database before migrating
    needs: [image-api, image-web, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

      - name: Snapshot if this release adds migrations
        # THE GAP THIS CLOSES. `prisma migrate deploy` runs in the next stage and
        # cannot be undone. Everything the rollback machinery protects is about
        # the CODE: the compatibility gate proves the previous release can still
        # read the migrated schema, and rollback-release.sh puts that release back
        # in front of traffic. None of it restores a column a migration dropped or
        # a value a migration rewrote — for that the only answer is a dump, and
        # the newest one could be up to 26 hours old (docs/DEPLOYMENT.md,
        # "Freshness"). So one is taken here, from the release that is still
        # running, immediately before the schema changes under it.
        #
        # Only when there is something to protect against: the snapshot is taken
        # when this release carries a migration directory the active release does
        # not. A deploy that changes no migration runs nothing here, which keeps
        # the common case as fast as it was.
        #
        # A failure is fatal on purpose. Proceeding would run an irreversible
        # migration with a safety net nobody checked. ALLOW_MIGRATION_WITHOUT_BACKUP
        # is the escape hatch for the day that trade is knowingly the right one.
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          RELEASE_ID: ${{ github.sha }}
          ALLOW_MIGRATION_WITHOUT_BACKUP: ${{ vars.ALLOW_MIGRATION_WITHOUT_BACKUP }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" bash -s -- \
            "$APP_DIR" "$RELEASE_ID" "${ALLOW_MIGRATION_WITHOUT_BACKUP:-false}" <<'REMOTE'
          set -eu
          APP_DIR="$1"
          RELEASE_ID="$2"
          ALLOW_WITHOUT_BACKUP="$3"
          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"
          MIGRATIONS_SUBPATH="apps/api/prisma/migrations"

          if [ ! -L "$APP_DIR/current" ] && [ ! -e "$APP_DIR/current" ]; then
            echo "First deploy: there is no running release and no database to snapshot."
            exit 0
          fi

          list_migrations() {
            # Directory names only, sorted. A missing directory is not an error:
            # it means that release carried no migrations at all.
            if [ -d "$1/$MIGRATIONS_SUBPATH" ]; then
              find "$1/$MIGRATIONS_SUBPATH" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
            fi
          }

          added="$(comm -13 \
            <(list_migrations "$APP_DIR/current") \
            <(list_migrations "$RELEASE_DIR") || true)"

          if [ -z "$added" ]; then
            echo "No new migrations in $RELEASE_ID; the schema is unchanged and no snapshot is needed."
            exit 0
          fi

          echo "This release adds the following migrations:"
          printf '  %s\n' $added
          echo "Taking a snapshot of the live database before they are applied."

          BACKUP_SCRIPT="$APP_DIR/current/deploy/backup/pg-backup.sh"
          if [ ! -x "$BACKUP_SCRIPT" ]; then
            echo "ERROR: $BACKUP_SCRIPT is missing or not executable on the server." >&2
            echo "The active release predates the backup tooling, so no pre-migration snapshot can be taken." >&2
          elif "$BACKUP_SCRIPT" --app-dir "$APP_DIR"; then
            echo "OK: a snapshot of the pre-migration database is in the bucket."
            exit 0
          else
            echo "ERROR: the pre-migration snapshot failed." >&2
          fi

          # Either the script was missing or it failed. Both mean the same thing.
          if [ "$ALLOW_WITHOUT_BACKUP" = "true" ]; then
            echo "WARNING: ALLOW_MIGRATION_WITHOUT_BACKUP=true — applying an irreversible migration with NO verified snapshot taken immediately before it." >&2
            exit 0
          fi
          echo "Refusing to migrate without one. Nothing has been changed: the previous release is still serving and the schema is untouched." >&2
          echo "Fix the backup (docs/DEPLOYMENT.md, 'Database backup and restore'), or set the ALLOW_MIGRATION_WITHOUT_BACKUP variable to 'true' to deploy anyway." >&2
          exit 1
          REMOTE

  release:
    name: Release and switch traffic
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

      - name: Start release and smoke test
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          RELEASE_ID: ${{ github.sha }}
          # Escape hatch for the one legitimate case: the rollback target's image
          # was pruned off the server, so its compatibility cannot be proven. Set
          # the repository/environment variable to "true" ONLY when knowingly
          # deploying without a verified rollback. Anything else fails the deploy.
          ALLOW_UNVERIFIED_ROLLBACK: ${{ vars.ALLOW_UNVERIFIED_ROLLBACK }}
        run: |
          set -euo pipefail
          # The script ships with the release (deploy/release.sh): the package stage
          # has already extracted this commit into releases/<commit>, so what runs is
          # exactly the reviewed and tested copy for this commit.
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$RELEASE_ID" "${ALLOW_UNVERIFIED_ROLLBACK:-false}" <<'REMOTE'
          set -eu
          RELEASE_SCRIPT="$1/releases/$2/deploy/release.sh"
          if [ ! -f "$RELEASE_SCRIPT" ]; then
            echo "ERROR: $RELEASE_SCRIPT is missing; the package stage did not install this release." >&2
            exit 1
          fi
          exec bash "$RELEASE_SCRIPT" "$1" "$2" "$3"
          REMOTE

  # LAST IN THIS FILE ON PURPOSE. DEPLOY-007 reads from the "Public smoke test"
  # step to the end of the workflow and requires that nothing there can exit 0
  # except the smoke test's own success — a check that only means anything while
  # this step is the final word on whether the release stays.
  verify:
    name: Verify the deployment
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

      - name: Public smoke test
        # Runs on the RUNNER, not over SSH. The point of a public smoke test is
        # to look at the deployment from outside it: a check that curls the site
        # from the machine that serves it cannot see a DNS record that was never
        # published, a certificate that was never issued, or a proxy in front
        # refusing traffic. Diagnostics are still fetched over SSH, but only
        # after the verdict is in — and so is the rollback, because by this point
        # the release script has exited and its exit handler is gone.
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -uo pipefail
          # fluxradar:public-smoke-invocation (regression-tested by
          # apps/api/src/deploy/deploy-007-public-smoke.test.ts — keep the
          # markers, the test extracts and asserts exactly these lines)
          #
          # deploy/public-smoke.sh validates the certificate, requires https end
          # to end, and asserts the status, the body and the security header of
          # every endpoint it checks. A hostname that does not resolve is a
          # failure, not a pass: the old check exited 0 on missing DNS and used
          # `curl --insecure`, so a wrong, expired or self-signed certificate
          # deployed silently.
          if bash deploy/public-smoke.sh --host fluxradar.net; then
            exit 0
          fi
          # fluxradar:end-public-smoke-invocation

          echo 'Public smoke failed; collecting sanitized Caddy diagnostics from the server.' >&2
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" <<'REMOTE' || true
          set -eu
          APP_DIR="$1"
          cd "$APP_DIR/current"
          docker compose --env-file .env.production -p fluxradar ps caddy 2>&1 || true
          CADDY_CONTAINER="$(docker compose --env-file .env.production -p fluxradar ps -q caddy 2>/dev/null || true)"
          if [ -n "$CADDY_CONTAINER" ]; then
            docker inspect --format 'status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} exitCode={{.State.ExitCode}} error={{.State.Error}}' "$CADDY_CONTAINER" 2>&1 || true
            docker logs --tail 80 "$CADDY_CONTAINER" 2>&1 || true
          fi
          REMOTE

          # fluxradar:public-smoke-rollback (regression-tested by
          # apps/api/src/deploy/deploy-012-public-smoke-rollback.test.ts — keep
          # the markers, the test extracts and RUNS exactly these lines)
          #
          # This is the ONE failure the release script's exit handler cannot
          # reach: that script has already exited 0, so the new release is live,
          # recorded, and serving a site that just failed a check from outside.
          # docs/DEPLOYMENT.md promises a failed rollout does not leave a broken
          # release in front of traffic, and this is what keeps that true.
          #
          # It is the same rollback the release script uses, run on the server
          # against the target that script recorded before it switched traffic.
          # The certificate/DNS conditions the local checks deliberately do not
          # test are exactly the ones this catches, and a rollback is the right
          # answer to them too: the previous release held a working certificate
          # for the same hostname.
          #
          # The rollback's exit code is the whole verdict, so it is captured
          # rather than collapsed into if/else: 3 means there was no earlier
          # release and the script therefore touched NOTHING — on a first deploy
          # the unconditional version removed the only API and web containers on
          # the host and exited 1, so a failed smoke test became a host serving
          # nothing at all. None of the three outcomes is hidden, and none of
          # them passes the step.
          echo 'Rolling back: a release that fails the public smoke test must not stay live.' >&2
          rollback_status=0
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$RELEASE_ID" <<'REMOTE' || rollback_status=$?
          set -eu
          APP_DIR="$1"
          RELEASE_ID="$2"
          bash "$APP_DIR/releases/$RELEASE_ID/deploy/rollback-release.sh" "$APP_DIR" "$APP_DIR/releases/$RELEASE_ID"
          REMOTE
          if [ "$rollback_status" -eq 0 ]; then
            # Ask the same question that failed, from the same place, about the
            # release that is now serving.
            if bash deploy/public-smoke.sh --host fluxradar.net; then
              echo 'Rolled back: the previous release is serving fluxradar.net again.' >&2
            else
              echo 'CRITICAL: the rollback ran but fluxradar.net still fails the public smoke test. Production needs manual recovery (docs/DEPLOYMENT.md, "Release rollback").' >&2
            fi
          elif [ "$rollback_status" -eq 3 ]; then
            echo 'CRITICAL: there is no earlier release on this host to roll back to (first deploy), so nothing was torn down and the release that failed the public smoke test is still live. Production needs manual attention: deploy a working release (docs/DEPLOYMENT.md, "Release rollback").' >&2
          elif [ "$rollback_status" -eq 4 ]; then
            echo 'CRITICAL: the release that failed the public smoke test is also the recorded rollback target (a redeploy of the live commit), so there is no different release to go back to and nothing was changed. Production needs manual attention: deploy a known-good commit (docs/DEPLOYMENT.md, "Release rollback").' >&2
          else
            echo 'CRITICAL: the rollback failed; the release that failed the public smoke test may still be live. Production needs manual recovery (docs/DEPLOYMENT.md, "Release rollback").' >&2
          fi
          # fluxradar:end-public-smoke-rollback
          exit 1
