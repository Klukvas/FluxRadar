name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://fluxradar:fluxradar-test@localhost:5432/fluxradar_test
      TEST_DATABASE_URL: postgresql://fluxradar:fluxradar-test@localhost:5432/fluxradar_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fluxradar_test
          POSTGRES_USER: fluxradar
          POSTGRES_PASSWORD: fluxradar-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxradar -d fluxradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Hetzner
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Create release archive
        env:
          # PRODUCTION_ENV_FILE is the authoritative base env file and is never
          # overwritten blindly. The optional secrets below are merged on top of
          # it only when provided; each lives in its own production environment
          # secret so integrations can be connected one at a time.
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          INTERNAL_FREE_EMAILS: ${{ vars.FLUXRADAR_INTERNAL_FREE_EMAILS }}
          PRODUCTION_INTEGRATION_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_INTEGRATION_ENCRYPTION_KEY }}
          PRODUCTION_BING_OAUTH_CLIENT_ID: ${{ secrets.PRODUCTION_BING_OAUTH_CLIENT_ID }}
          PRODUCTION_BING_OAUTH_CLIENT_SECRET: ${{ secrets.PRODUCTION_BING_OAUTH_CLIENT_SECRET }}
          PRODUCTION_BING_OAUTH_REDIRECT_URI: ${{ secrets.PRODUCTION_BING_OAUTH_REDIRECT_URI }}
          PRODUCTION_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_CLIENT_ID }}
          PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET }}
          PRODUCTION_GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.PRODUCTION_GOOGLE_OAUTH_REDIRECT_URI }}
          PRODUCTION_ANTHROPIC_API_KEY: ${{ secrets.PRODUCTION_ANTHROPIC_API_KEY }}
          PRODUCTION_PAGESPEED_API_KEY: ${{ secrets.PRODUCTION_PAGESPEED_API_KEY }}
          PRODUCTION_CRUX_API_KEY: ${{ secrets.PRODUCTION_CRUX_API_KEY }}
          PRODUCTION_HETZNER_S3_ACCESS_KEY: ${{ secrets.PRODUCTION_HETZNER_S3_ACCESS_KEY }}
          PRODUCTION_HETZNER_S3_SECRET_KEY: ${{ secrets.PRODUCTION_HETZNER_S3_SECRET_KEY }}
          PRODUCTION_HETZNER_S3_ENDPOINT: ${{ secrets.PRODUCTION_HETZNER_S3_ENDPOINT }}
          PRODUCTION_HETZNER_S3_REGION: ${{ secrets.PRODUCTION_HETZNER_S3_REGION }}
          PRODUCTION_HETZNER_S3_BUCKET: ${{ secrets.PRODUCTION_HETZNER_S3_BUCKET }}
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='client_secret_*.json' \
            -czf "$RUNNER_TEMP/release.tar.gz" .
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$RUNNER_TEMP/production.env"

          # Upserts KEY=<value> into the release env file, but only when the
          # optional source secret is non-empty. The value is read from the named
          # environment variable and written with printf %s, so it never appears
          # in the workflow log or process arguments and is copied verbatim (no
          # awk/gsub escaping surprises). An unset or empty secret is skipped so a
          # blank optional value can never override what PRODUCTION_ENV_FILE
          # already defines.
          upsert_env() {
            key="$1"
            source_var="$2"
            value="$(printenv "$source_var" || true)"
            if [ -z "$value" ]; then
              return 0
            fi
            grep -v "^${key}=" "$RUNNER_TEMP/production.env" \
              > "$RUNNER_TEMP/production.env.tmp" || true
            mv "$RUNNER_TEMP/production.env.tmp" "$RUNNER_TEMP/production.env"
            printf '%s=%s\n' "$key" "$value" >> "$RUNNER_TEMP/production.env"
          }

          upsert_env FLUXRADAR_INTERNAL_FREE_EMAILS INTERNAL_FREE_EMAILS
          upsert_env INTEGRATION_ENCRYPTION_KEY PRODUCTION_INTEGRATION_ENCRYPTION_KEY
          upsert_env BING_OAUTH_CLIENT_ID PRODUCTION_BING_OAUTH_CLIENT_ID
          upsert_env BING_OAUTH_CLIENT_SECRET PRODUCTION_BING_OAUTH_CLIENT_SECRET
          upsert_env BING_OAUTH_REDIRECT_URI PRODUCTION_BING_OAUTH_REDIRECT_URI
          upsert_env GOOGLE_OAUTH_CLIENT_ID PRODUCTION_GOOGLE_OAUTH_CLIENT_ID
          upsert_env GOOGLE_OAUTH_CLIENT_SECRET PRODUCTION_GOOGLE_OAUTH_CLIENT_SECRET
          upsert_env GOOGLE_OAUTH_REDIRECT_URI PRODUCTION_GOOGLE_OAUTH_REDIRECT_URI
          upsert_env ANTHROPIC_API_KEY PRODUCTION_ANTHROPIC_API_KEY
          upsert_env PAGESPEED_API_KEY PRODUCTION_PAGESPEED_API_KEY
          upsert_env CRUX_API_KEY PRODUCTION_CRUX_API_KEY
          upsert_env HETZNER_S3_ACCESS_KEY PRODUCTION_HETZNER_S3_ACCESS_KEY
          upsert_env HETZNER_S3_SECRET_KEY PRODUCTION_HETZNER_S3_SECRET_KEY
          upsert_env HETZNER_S3_ENDPOINT PRODUCTION_HETZNER_S3_ENDPOINT
          upsert_env HETZNER_S3_REGION PRODUCTION_HETZNER_S3_REGION
          upsert_env HETZNER_S3_BUCKET PRODUCTION_HETZNER_S3_BUCKET

      - name: Build production images
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          docker build --file Dockerfile.api --tag "fluxradar-api:$RELEASE_ID" .
          docker build --file Dockerfile.web --tag "fluxradar-web:$RELEASE_ID" .
          docker save --output "$RUNNER_TEMP/fluxradar-images.tar" \
            "fluxradar-api:$RELEASE_ID" "fluxradar-web:$RELEASE_ID"

      - name: Preflight remote disk space and stale staging cleanup
        # Runs before "Upload release" so scp cannot fail mid-write on a full
        # disk. Uploads are staged under APP_DIR/incoming/<commit> on the ROOT
        # filesystem (which has ample free space), not the tiny /tmp tmpfs. This
        # gate therefore checks free space on the APP_DIR filesystem and reclaims
        # ONLY this workflow's own stale per-release staging directories under
        # APP_DIR/incoming. It never touches releases, current, runtime, Docker
        # data/volumes, or PostgreSQL.
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
        run: |
          set -euo pipefail
          # Measure the exact bytes we are about to upload (release archive + env
          # file + image tar) so the remote free-space gate is precise rather than
          # an arbitrary constant. du -k reports block usage, which slightly rounds
          # up and is therefore conservative (never under-estimates the need).
          required_kb="$(du -ck \
            "$RUNNER_TEMP/release.tar.gz" \
            "$RUNNER_TEMP/production.env" \
            "$RUNNER_TEMP/fluxradar-images.tar" \
            | tail -n 1 | cut -f1)"
          case "$required_kb" in
            ''|*[!0-9]*)
              echo "ERROR: could not determine local upload size (got '$required_kb')" >&2
              exit 1
              ;;
          esac
          # The staged artifacts live on the root filesystem only briefly: the
          # release archive is extracted and the image tar is loaded into Docker,
          # which transiently roughly doubles the footprint before the staging dir
          # is removed. Reserve headroom equal to the artifact size (floored at
          # 512 MiB) to cover that transient copy plus slack. The root filesystem
          # has ~20G free, so this stays comfortably safe while still refusing a
          # genuinely full disk.
          margin_kb="$required_kb"
          floor_kb=524288
          if [ "$margin_kb" -lt "$floor_kb" ]; then margin_kb="$floor_kb"; fi
          need_kb=$(( required_kb + margin_kb ))

          # Only remove staging dirs this workflow itself creates and only if they
          # are older than a threshold safely larger than a single deploy. Deploys
          # are serialized by the "production-deploy" concurrency group and the job
          # times out at 30 minutes, so a 60-minute floor cannot race an in-flight
          # upload from another run.
          stale_minutes=60

          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$need_kb" "$stale_minutes" "$APP_DIR" <<'REMOTE'
          set -eu
          NEED_KB="$1"
          STALE_MINUTES="$2"
          APP_DIR="$3"
          INCOMING_DIR="$APP_DIR/incoming"

          echo "----- remote disk usage: APP_DIR filesystem (before cleanup) -----"
          # df prints the mount point (e.g. /) in its last column, not the path we
          # pass, so the APP_DIR value is not written to the log here.
          df -P -h "$APP_DIR" || true

          # Ensure the staging parent exists (owner-only) so the space math and the
          # cleanup below are stable even on a fresh host. Creating it changes
          # nothing about releases, current, runtime, Docker data, or PostgreSQL.
          install -m 700 -d "$INCOMING_DIR"

          echo "----- reclaiming stale FluxRadar staging dirs under incoming/ -----"
          # Safety scope, enforced by the predicates below:
          #   -mindepth/-maxdepth 1 : only immediate children of incoming/; never
          #                           recurses into them or above incoming/.
          #   -type d               : only directories (per-release staging); never
          #                           files, symlinks, sockets, or Docker volumes.
          #   name is strict hex     : the name must look like a git commit id
          #                           (7-64 lowercase hex chars); anything else is
          #                           skipped, so a stray file/dir is never removed.
          #   -mmin +N               : only entries older than the stale threshold.
          # APP_DIR/releases, current, runtime, Docker data (/var/lib/docker), and
          # PostgreSQL's volume all live OUTSIDE incoming/, so none can be selected.
          find "$INCOMING_DIR" -mindepth 1 -maxdepth 1 -type d -mmin "+${STALE_MINUTES}" -printf '%f\n' \
            | while IFS= read -r name; do
                case "$name" in
                  ''|*[!0-9a-f]*) continue ;;
                esac
                len=${#name}
                if [ "$len" -lt 7 ] || [ "$len" -gt 64 ]; then
                  continue
                fi
                target="$INCOMING_DIR/$name"
                case "$target" in
                  "$INCOMING_DIR"/*) ;;
                  *) continue ;;
                esac
                echo "removing stale staging dir incoming/$name"
                rm -rf -- "$target"
              done

          echo "----- remote disk usage: APP_DIR filesystem (after cleanup) -----"
          df -P -h "$APP_DIR" || true

          avail_kb="$(df -P -k "$APP_DIR" | awk 'NR==2 {print $4}')"
          case "$avail_kb" in
            ''|*[!0-9]*)
              echo "ERROR: could not determine free space on the APP_DIR filesystem (got '$avail_kb')" >&2
              exit 1
              ;;
          esac
          if [ "$avail_kb" -lt "$NEED_KB" ]; then
            echo "ERROR: insufficient free space on the APP_DIR filesystem: ${avail_kb} KiB free but ${NEED_KB} KiB required for this release (artifacts + extraction/load headroom)." >&2
            echo "Refusing to upload. No releases, current symlink, runtime, Docker data/volumes, or PostgreSQL were touched; inspect the APP_DIR filesystem." >&2
            exit 1
          fi
          echo "OK: APP_DIR filesystem has ${avail_kb} KiB free (need ${NEED_KB} KiB); proceeding to upload."
          REMOTE

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Stage every large artifact under a dedicated, per-release directory on
          # the ROOT filesystem (APP_DIR/incoming/<commit>) instead of the tiny
          # /tmp tmpfs. The staging dir is created up front with owner-only
          # permissions and removed again after a successful install.
          STAGE_DIR="$APP_DIR/incoming/$RELEASE_ID"

          # On ANY failure below, remove ONLY this release's staging dir to reclaim
          # space, then re-raise the original error. This never touches releases/,
          # current, runtime, Docker data/volumes, or PostgreSQL, and it preserves
          # the failing exit status so the real error is not masked.
          cleanup_stage() {
            # shellcheck disable=SC2029
            ssh "$SSH_USER@$SSH_HOST" "rm -rf -- '$STAGE_DIR'" || true
          }
          trap 'rc=$?; cleanup_stage; exit "$rc"' ERR

          # Create the exact per-release staging dir (and its parent) with safe,
          # owner-only permissions before any scp so writes cannot fail mid-stream.
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" "install -m 700 -d '$APP_DIR/incoming' '$STAGE_DIR'"

          scp "$RUNNER_TEMP/release.tar.gz" "$SSH_USER@$SSH_HOST:$STAGE_DIR/release.tar.gz"
          scp "$RUNNER_TEMP/production.env" "$SSH_USER@$SSH_HOST:$STAGE_DIR/production.env"
          scp "$RUNNER_TEMP/fluxradar-images.tar" "$SSH_USER@$SSH_HOST:$STAGE_DIR/images.tar"

          # Load, extract, and install strictly from the staging dir, then remove
          # ONLY that exact staging dir on success. If this fails partway, the ERR
          # trap above cleans the staging dir; the (inactive) new release dir is
          # left for the retention sweep and no active release/volume is deleted.
          # shellcheck disable=SC2029
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$RELEASE_ID" <<'REMOTE'
          set -eu
          APP_DIR="$1"
          RELEASE_ID="$2"
          STAGE_DIR="$APP_DIR/incoming/$RELEASE_ID"
          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"
          docker load --input "$STAGE_DIR/images.tar"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$STAGE_DIR/release.tar.gz" -C "$RELEASE_DIR"
          install -m 600 "$STAGE_DIR/production.env" "$RELEASE_DIR/.env.production"
          # Success: remove ONLY this release's staging dir to reclaim space.
          rm -rf -- "$STAGE_DIR"
          REMOTE

          trap - ERR

      - name: Start release and smoke test
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$RELEASE_ID" <<'REMOTE'
          set -eu
          set -o pipefail
          APP_DIR="$1"
          RELEASE_ID="$2"
          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"
          RUNTIME_DIR="$APP_DIR/runtime"
          STATE_FILE="$RUNTIME_DIR/active.env"
          FLUXRADAR_NETWORK=""
          PREVIOUS_RELEASE="$(readlink -f "$APP_DIR/current" 2>/dev/null || true)"
          API_IMAGE="fluxradar-api:$RELEASE_ID"
          WEB_IMAGE="fluxradar-web:$RELEASE_ID"
          PREVIOUS_API_UPSTREAM=""
          PREVIOUS_WEB_UPSTREAM=""
          PREVIOUS_API_CONTAINER=""
          PREVIOUS_WEB_CONTAINER=""
          LEGACY_API_CONTAINER=""
          LEGACY_WEB_CONTAINER=""
          if [ -f "$STATE_FILE" ]; then
            . "$STATE_FILE"
            PREVIOUS_API_UPSTREAM="${FLUXRADAR_API_UPSTREAM:-}"
            PREVIOUS_WEB_UPSTREAM="${FLUXRADAR_WEB_UPSTREAM:-}"
            PREVIOUS_API_CONTAINER="${FLUXRADAR_API_CONTAINER:-}"
            PREVIOUS_WEB_CONTAINER="${FLUXRADAR_WEB_CONTAINER:-}"
          fi
          if [ -z "$PREVIOUS_API_UPSTREAM" ] && [ -n "$PREVIOUS_RELEASE" ]; then
            cd "$PREVIOUS_RELEASE"
            LEGACY_API_CONTAINER="$(docker compose --env-file .env.production -p fluxradar ps -q api 2>/dev/null || true)"
            LEGACY_WEB_CONTAINER="$(docker compose --env-file .env.production -p fluxradar ps -q web 2>/dev/null || true)"
          fi

          API_CONTAINER="fluxradar-api-$RELEASE_ID"
          WEB_CONTAINER="fluxradar-web-$RELEASE_ID"
          NEW_API_UPSTREAM="$API_CONTAINER:3310"
          NEW_WEB_UPSTREAM="$WEB_CONTAINER:80"

          atomic_switch() {
            ln -sfn "$1" "$APP_DIR/current.next"
            mv -Tf "$APP_DIR/current.next" "$APP_DIR/current"
          }

          render_caddyfile() {
            awk -v api="$1" -v web="$2" '{
              gsub(/\{\$FLUXRADAR_API_UPSTREAM\}/, api)
              gsub(/\{\$FLUXRADAR_WEB_UPSTREAM\}/, web)
              print
            }' "$3" > "$RUNTIME_DIR/Caddyfile.next"
            if [ -f "$RUNTIME_DIR/Caddyfile" ]; then
              cat "$RUNTIME_DIR/Caddyfile.next" > "$RUNTIME_DIR/Caddyfile"
              rm -f "$RUNTIME_DIR/Caddyfile.next"
            else
              mv -f "$RUNTIME_DIR/Caddyfile.next" "$RUNTIME_DIR/Caddyfile"
            fi
            chmod 644 "$RUNTIME_DIR/Caddyfile"
          }

          restore_state() {
            if [ -n "$PREVIOUS_API_UPSTREAM" ] && [ -n "$PREVIOUS_WEB_UPSTREAM" ]; then
              cat > "$STATE_FILE" <<STATE
          FLUXRADAR_ACTIVE_RELEASE=$PREVIOUS_RELEASE
          FLUXRADAR_API_UPSTREAM=$PREVIOUS_API_UPSTREAM
          FLUXRADAR_WEB_UPSTREAM=$PREVIOUS_WEB_UPSTREAM
          FLUXRADAR_API_CONTAINER=$PREVIOUS_API_CONTAINER
          FLUXRADAR_WEB_CONTAINER=$PREVIOUS_WEB_CONTAINER
          STATE
              chmod 600 "$STATE_FILE"
            else
              rm -f "$STATE_FILE"
            fi
          }

          rollback() {
            set +e
            docker rm -f "$API_CONTAINER" "$WEB_CONTAINER" >/dev/null 2>&1 || true
            if [ -n "$PREVIOUS_RELEASE" ] && [ -f "$PREVIOUS_RELEASE/docker-compose.yml" ]; then
              cd "$PREVIOUS_RELEASE"
              if [ -n "$PREVIOUS_API_UPSTREAM" ] && [ -n "$PREVIOUS_WEB_UPSTREAM" ]; then
                render_caddyfile "$PREVIOUS_API_UPSTREAM" "$PREVIOUS_WEB_UPSTREAM" "$PREVIOUS_RELEASE/deploy/Caddyfile"
                export FLUXRADAR_CADDYFILE="$RUNTIME_DIR/Caddyfile"
                export FLUXRADAR_API_UPSTREAM="$PREVIOUS_API_UPSTREAM"
                export FLUXRADAR_WEB_UPSTREAM="$PREVIOUS_WEB_UPSTREAM"
                docker compose --env-file .env.production -p fluxradar up -d --no-deps --force-recreate caddy || true
              else
                export FLUXRADAR_CADDYFILE="$PREVIOUS_RELEASE/deploy/Caddyfile"
                export FLUXRADAR_API_UPSTREAM="api:3310"
                export FLUXRADAR_WEB_UPSTREAM="web:80"
                docker compose --env-file .env.production -p fluxradar up -d --no-deps --force-recreate caddy || true
              fi
              atomic_switch "$PREVIOUS_RELEASE" || true
            fi
            restore_state || true
            # Never let an ERR trap turn a failed release into a successful one.
            return 1
          }

          # Prints why a container is unhealthy without leaking configuration.
          # Uses an explicit field list from `docker inspect` (never .Config.Env)
          # plus the container's own log output, which carries the startup error
          # (e.g. "Missing required production configuration: ...") but no secret
          # values. Bounded to the last log lines so the deploy log stays readable.
          dump_container_diagnostics() {
            container_name="$1"
            echo "----- diagnostics: $container_name -----"
            docker inspect \
              --format 'status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} restartCount={{.RestartCount}} error={{.State.Error}}' \
              "$container_name" 2>/dev/null || echo "container not found: $container_name"
            echo "----- last 80 log lines: $container_name -----"
            docker logs --tail 80 "$container_name" 2>&1 || echo "no logs available: $container_name"
            echo "----- end diagnostics: $container_name -----"
          }
          trap rollback ERR

          mkdir -p "$RUNTIME_DIR"
          cd "$RELEASE_DIR"
          docker compose --env-file .env.production -p fluxradar up -d postgres
          POSTGRES_CONTAINER="$(docker compose --env-file .env.production -p fluxradar ps -q postgres)"
          if [ -z "$POSTGRES_CONTAINER" ]; then
            echo "PostgreSQL container was not created; cannot determine the application network" >&2
            exit 1
          fi
          FLUXRADAR_NETWORK="$(docker inspect --format '{{range $network, $_ := .NetworkSettings.Networks}}{{println $network}}{{end}}' "$POSTGRES_CONTAINER" | awk 'NF { print; exit }')"
          if [ -z "$FLUXRADAR_NETWORK" ]; then
            echo "Could not determine the Docker network attached to PostgreSQL" >&2
            exit 1
          fi
          ensure_network_attachment() {
            container_name="$1"
            if ! docker inspect --format '{{range $network, $_ := .NetworkSettings.Networks}}{{println $network}}{{end}}' "$container_name" \
              | grep -Fxq "$FLUXRADAR_NETWORK"; then
              docker network connect "$FLUXRADAR_NETWORK" "$container_name"
            fi
          }
          docker run --rm \
            --name "${API_CONTAINER}-migrate" \
            --network "$FLUXRADAR_NETWORK" \
            --env-file "$RELEASE_DIR/.env.production" \
            --env NODE_ENV=production \
            --env PORT=3310 \
            --env FRONTEND_ORIGIN=https://fluxradar.net \
            "$API_IMAGE" \
            apps/api/node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma
          docker rm -f "$API_CONTAINER" "$WEB_CONTAINER" >/dev/null 2>&1 || true
          docker run -d \
            --name "$API_CONTAINER" \
            --restart unless-stopped \
            --network "$FLUXRADAR_NETWORK" \
            --env-file "$RELEASE_DIR/.env.production" \
            --env NODE_ENV=production \
            --env PORT=3310 \
            --env FRONTEND_ORIGIN=https://fluxradar.net \
            "$API_IMAGE"
          docker run -d \
            --name "$WEB_CONTAINER" \
            --restart unless-stopped \
            --network "$FLUXRADAR_NETWORK" \
            "$WEB_IMAGE"
          ensure_network_attachment "$API_CONTAINER"
          ensure_network_attachment "$WEB_CONTAINER"

          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$API_CONTAINER" node -e "fetch('http://127.0.0.1:3310/health/ready').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))" \
              && docker exec "$WEB_CONTAINER" wget -q -O /dev/null http://127.0.0.1/health; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "API/web readiness never became true after $((30 * 2))s; collecting sanitized diagnostics" >&2
            docker ps --filter "name=$API_CONTAINER" --filter "name=$WEB_CONTAINER"
            dump_container_diagnostics "$API_CONTAINER"
            dump_container_diagnostics "$WEB_CONTAINER"
            exit 1
          fi

          render_caddyfile "$NEW_API_UPSTREAM" "$NEW_WEB_UPSTREAM" "$RELEASE_DIR/deploy/Caddyfile"
          cd "$RELEASE_DIR"
          # Always recreate Caddy with the generated runtime file. Reloading an
          # existing container is unsafe here because it may still mount the
          # previous release's deploy/Caddyfile and upstream names.
          export FLUXRADAR_CADDYFILE="$RUNTIME_DIR/Caddyfile"
          export FLUXRADAR_API_UPSTREAM="$NEW_API_UPSTREAM"
          export FLUXRADAR_WEB_UPSTREAM="$NEW_WEB_UPSTREAM"
          docker compose --env-file .env.production -p fluxradar up -d --no-deps --force-recreate caddy

          caddy_ready=0
          for attempt in $(seq 1 15); do
            CADDY_CONTAINER="$(docker compose --env-file .env.production -p fluxradar ps -q caddy)"
            if [ -n "$CADDY_CONTAINER" ] && [ "$(docker inspect -f '{{.State.Running}}' "$CADDY_CONTAINER")" = "true" ]; then
              caddy_ready=1
              break
            fi
            sleep 2
          done
          if [ "$caddy_ready" -ne 1 ]; then exit 1; fi
          ensure_network_attachment "$CADDY_CONTAINER"
          if ! grep -Fq "$NEW_API_UPSTREAM" "$RUNTIME_DIR/Caddyfile" \
            || ! grep -Fq "$NEW_WEB_UPSTREAM" "$RUNTIME_DIR/Caddyfile"; then
            echo "Generated Caddyfile does not reference the new release upstreams" >&2
            exit 1
          fi
          if ! docker exec "$CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
            echo "Caddy configuration validation failed" >&2
            docker logs --tail 80 "$CADDY_CONTAINER" 2>&1 || true
            exit 1
          fi
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --retry-connrefused \
            --location --insecure --header 'Host: fluxradar.net' \
            https://127.0.0.1/api/health >/dev/null

          atomic_switch "$RELEASE_DIR"
          cat > "$STATE_FILE" <<STATE
          FLUXRADAR_ACTIVE_RELEASE=$RELEASE_DIR
          FLUXRADAR_API_UPSTREAM=$NEW_API_UPSTREAM
          FLUXRADAR_WEB_UPSTREAM=$NEW_WEB_UPSTREAM
          FLUXRADAR_API_CONTAINER=$API_CONTAINER
          FLUXRADAR_WEB_CONTAINER=$WEB_CONTAINER
          STATE
          chmod 600 "$STATE_FILE"
          if [ -n "$PREVIOUS_API_CONTAINER" ] || [ -n "$PREVIOUS_WEB_CONTAINER" ]; then
            docker rm -f "$PREVIOUS_API_CONTAINER" "$PREVIOUS_WEB_CONTAINER" >/dev/null 2>&1 || true
          fi
          if [ -n "$LEGACY_API_CONTAINER" ] || [ -n "$LEGACY_WEB_CONTAINER" ]; then
            docker rm -f "$LEGACY_API_CONTAINER" "$LEGACY_WEB_CONTAINER" >/dev/null 2>&1 || true
          fi
          trap - ERR
          # Keep the active release plus two rollback candidates to bound disk use.
          find "$APP_DIR/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr | tail -n +4 | cut -d' ' -f2- \
            | while IFS= read -r old_release; do
                case "$old_release" in
                  "$APP_DIR/releases/"*) ;;
                  *) continue ;;
                esac
                old_id="${old_release##*/}"
                rm -rf -- "$old_release"
                docker image rm "fluxradar-api:$old_id" "fluxradar-web:$old_id" >/dev/null 2>&1 || true
              done || true
          REMOTE

      - name: Public smoke test
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" <<'REMOTE'
          set -eu
          APP_DIR="$1"
          if ! getent ahostsv4 fluxradar.net >/dev/null 2>&1; then
            echo 'DNS for fluxradar.net is not configured yet; internal smoke test passed.'
            exit 0
          fi
          if curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused --location --insecure https://fluxradar.net/api/health; then
            exit 0
          fi

          echo 'Public smoke failed; collecting sanitized Caddy diagnostics.' >&2
          cd "$APP_DIR/current"
          docker compose --env-file .env.production -p fluxradar ps caddy 2>&1 || true
          CADDY_CONTAINER="$(docker compose --env-file .env.production -p fluxradar ps -q caddy 2>/dev/null || true)"
          if [ -n "$CADDY_CONTAINER" ]; then
            docker inspect --format 'status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} exitCode={{.State.ExitCode}} error={{.State.Error}}' "$CADDY_CONTAINER" 2>&1 || true
            docker logs --tail 80 "$CADDY_CONTAINER" 2>&1 || true
          fi
          exit 1
          REMOTE
