name: Node workspace
description: >-
  pnpm + Node 24 + a frozen install, and optionally the compiled workspace
  output that the type checks and the API tests import through `dist`.

# Every quality job needs the same four steps, and when they were copied per job
# they drifted: a Node version bumped in one place, a pnpm version in another.
# The versions live here once, so a bump is one edit and every job moves with it.

inputs:
  download-dist:
    description: >-
      Download the `workspace-dist` artifact published by the build job. The
      workspace packages resolve through their `exports` to `dist/index.js`, so
      anything that imports one needs this; lint and the web tests do not.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.11.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Download compiled workspace
      if: inputs.download-dist == 'true'
      uses: actions/download-artifact@v4
      with:
        name: workspace-dist
