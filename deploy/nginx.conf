server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not emit absolute redirects that expose the internal upstream address
    # or an incorrect scheme (nginx sees plain HTTP even when Caddy terminates
    # TLS upstream).  All redirects, if any, are relative.
    absolute_redirect off;

    server_tokens off;

    # Security headers, second copy.
    # ─────────────────────────────
    # deploy/Caddyfile is the authority: Caddy's `header` directive SETS these
    # fields, so on the public path these values are replaced by Caddy's and the
    # browser sees exactly one of each.  They are repeated here because this
    # container is a complete web server that answers on its own port, and the
    # only thing keeping that port private is a loopback publish in
    # docker-compose.yml.  A document served without them from a compose file
    # edited in a hurry, a port-forward, or a future second proxy is the failure
    # this duplication exists to prevent.
    #
    # `always` matters: without it nginx omits them on error responses, which is
    # exactly where a served document is least trustworthy.
    #
    # DEPLOY-008 asserts this Content-Security-Policy is byte-for-byte the one in
    # deploy/Caddyfile, so the two can never drift into disagreeing about what
    # the application is allowed to load.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' https://sbl.onfastspring.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.onfastspring.com; frame-src https://*.onfastspring.com" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Routing strategy
    # ─────────────────
    # 1. $uri          — exact file match (JS/CSS bundles, images, robots.txt…)
    # 2. $uri/index.html — directory index file (blog index, article pages)
    #    This step is the key fix for clean blog paths such as /blog and
    #    /blog/ai-crawler-readiness: it directly tests the physical file without
    #    requiring a 301 redirect + nginx index-module round-trip.  With the
    #    classic `$uri/` form a /blog/ request produces `$uri/` = /blog// which
    #    nginx normalises (merge_slashes on) back to /blog/ — not a regular file
    #    — and the request falls through to /index.html (the SPA).
    # 3. /index.html   — SPA fallback for all non-file paths (/privacy, /scans/…)
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"web"}';
    }
}
