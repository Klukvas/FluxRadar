map $request_uri $private_page_robots {
    default "";
    ~^/login(/|\?|$) "noindex, nofollow";
    ~^/(profiles|scan|reports|integrations|account)(/|\?|$) "noindex, nofollow";
    ~^/(scans|checkout|api|admin)(/|\?|$) "noindex, nofollow";
}
# Migrate only the eight public Ukrainian query aliases. Auth/checkout tokens
# and ambiguous duplicate language parameters keep their existing application flow.
map $args $public_legacy_uk {
    default 0;
    ~(^|&)(verify_email|reset_token|request_id)(=|&|$) 0;
    ~(^|&)lang(=[^&]*)?&([^&]*&)*lang(=|&|$) 0;
    ~(^|&)[^=&]*%[0-9a-fA-F][0-9a-fA-F][^=&]*(=|&|$) 0;
    ~(^|&)lang=uk(&|$) 1;
}
map $args $public_remaining_args {
    default $args;
    ~^lang=uk$ "";
    ~^lang=uk&(.*)$ $1;
    ~^(.*)&lang=uk$ $1;
    ~^(.*)&lang=uk&(.*)$ $1&$2;
}
map $public_remaining_args $public_locale_suffix {
    "" "";
    default ?$public_remaining_args;
}
map "$uri:$public_legacy_uk" $public_locale_path {
    default "";
    ~^/:1$ /uk;
    ~^/faq:1$ /uk/faq;
    ~^/faq/:1$ /uk/faq;
    ~^/checks:1$ /uk/checks;
    ~^/checks/:1$ /uk/checks;
    ~^/bot:1$ /uk/bot;
    ~^/bot/:1$ /uk/bot;
    ~^/example-report:1$ /uk/example-report;
    ~^/example-report/:1$ /uk/example-report;
    ~^/privacy:1$ /uk/privacy;
    ~^/privacy/:1$ /uk/privacy;
    ~^/terms:1$ /uk/terms;
    ~^/terms/:1$ /uk/terms;
    ~^/cookies:1$ /uk/cookies;
    ~^/cookies/:1$ /uk/cookies;
}

# Addresses the single-page app answers with its own shell. Every other path
# that is not a file is a page that does not exist, and is answered 404 (with
# the same shell, whose "page not found" screen explains it) instead of a 200
# home page: a mistyped or removed address must not look like a working page to
# visitors or to search engines. Keep this in step with apps/web/src/app-routes.ts
# (workspace-paths.ts, ADMIN_STATS_PATH, the /scans/:id screens, /plans, /login).
# Public documents, the blog and the knowledge base are real files under
# $uri/index.html and never reach this list.
map $uri $spa_route {
    default 0;
    ~^/(uk|ru)?/?$ 1;
    ~^/(login|profiles|scan|reports|integrations|account|plans)/?$ 1;
    ~^/scans/[^/]+(/issues|/report)?/?$ 1;
    ~^/checkout/return/?$ 1;
    ~^/admin/stats/?$ 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not emit absolute redirects that expose the internal upstream address
    # or an incorrect scheme (nginx sees plain HTTP even when Caddy terminates
    # TLS upstream).  All redirects, if any, are relative.
    absolute_redirect off;

    server_tokens off;

    # No access log here. Every public request reaches this container through
    # Caddy, which already writes the one access log — client addresses masked,
    # one-time secrets such as ?reset_token= and ?verify_email= removed
    # (see the `log` block in deploy/Caddyfile). nginx's default `main` log would repeat each
    # request line verbatim, query string and X-Forwarded-For included, to the
    # container's stdout, which Docker keeps with no size or age limit.
    access_log off;

    # Security headers, second copy.
    # ─────────────────────────────
    # deploy/Caddyfile is the authority: Caddy's `header` directive SETS these
    # fields, so on the public path these values are replaced by Caddy's and the
    # browser sees exactly one of each.  They are repeated here because this
    # container is a complete web server that answers on its own port, and the
    # only thing keeping that port private is a loopback publish in
    # docker-compose.yml.  A document served without them from a compose file
    # edited in a hurry, a port-forward, or a future second proxy is the failure
    # this duplication exists to prevent.
    #
    # `always` matters: without it nginx omits them on error responses, which is
    # exactly where a served document is least trustworthy.
    #
    # DEPLOY-008 asserts this Content-Security-Policy is byte-for-byte the one in
    # deploy/Caddyfile, so the two can never drift into disagreeing about what
    # the application is allowed to load.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag $private_page_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.googletagmanager.com https://*.ingest.de.sentry.io; frame-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Routing strategy
    # ─────────────────
    # 1. $uri          — exact file match (JS/CSS bundles, images, robots.txt…)
    # 2. $uri/index.html — directory index file (blog index, article pages)
    #    This step is the key fix for clean blog paths such as /blog and
    #    /blog/ai-crawler-readiness: it directly tests the physical file without
    #    requiring a 301 redirect + nginx index-module round-trip.  With the
    #    classic `$uri/` form a /blog/ request produces `$uri/` = /blog// which
    #    nginx normalises (merge_slashes on) back to /blog/ — not a regular file
    #    — and the request falls through to /index.html (the SPA).
    # 3. @spa          — the SPA shell for the app's own addresses (/scans/…,
    #    /profiles, /login…, see $spa_route); any other path is a real 404.
    location / {
        if ($public_locale_path != "") {
            return 308 $public_locale_path$public_locale_suffix;
        }
        try_files $uri $uri/index.html @spa;
    }

    location @spa {
        if ($spa_route = 0) {
            return 404;
        }
        rewrite ^ /index.html break;
    }

    # The 404 body is the SPA shell, so its "page not found" screen is what a
    # visitor reads; the status line stays 404 for browsers and crawlers.
    error_page 404 @not_found;
    location @not_found {
        rewrite ^ /index.html break;
    }

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"web"}';
    }
}
