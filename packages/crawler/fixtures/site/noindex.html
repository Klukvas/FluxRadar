<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Noindex page — Fixture Site</title>
    <meta name="description" content="A page that asks search engines not to index it." />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <h1>Please do not index this page</h1>
    <p>
      The robots meta tag on this page carries a noindex directive, which SEO technical rules must
      surface whenever the page is otherwise reachable and linked from indexable pages.
    </p>
    <p><a href="/">Back home</a></p>
  </body>
</html>
