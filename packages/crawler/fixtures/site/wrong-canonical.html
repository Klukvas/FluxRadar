<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wrong canonical — Fixture Site</title>
    <meta name="description" content="A page whose canonical URL points at a foreign domain." />
    <link rel="canonical" href="https://another-domain.example/wrong-canonical.html" />
  </head>
  <body>
    <h1>Canonical points elsewhere</h1>
    <p>
      The canonical link element of this page references a completely different domain, which the
      SEO technical rules must report as a cross-domain canonical problem worth investigating.
    </p>
    <p><a href="/">Back home</a></p>
  </body>
</html>
